<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200"
  role="img" aria-labelledby="title desc">
  <title id="title">Open Media Intelligence Platform</title>
  <desc id="desc">An eye and broadcast signal symbol beside the Open Media Intelligence wordmark.</desc>

  <defs>
    <linearGradient id="iconGradient" x1="18" y1="18" x2="178" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.58" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="irisGradient" x1="70" y1="68" x2="126" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect width="920" height="200" fill="none"/>

  <!-- Symbol -->
  <rect x="10" y="10" width="180" height="180" rx="34" fill="url(#iconGradient)"/>

  <!-- Broadcast arcs -->
  <path d="M124 48 A48 48 0 0 1 153 77" fill="none" stroke="#A5F3FC"
        stroke-width="8" stroke-linecap="round"/>
  <path d="M132 29 A71 71 0 0 1 174 71" fill="none" stroke="#67E8F9"
        stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- Eye / intelligence -->
  <path d="M39 105 C58 72 82 58 100 58 C119 58 143 72 162 105
           C143 138 119 152 100 152 C82 152 58 138 39 105Z"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="100" cy="105" r="25" fill="url(#irisGradient)"/>
  <circle cx="100" cy="105" r="10" fill="#0F172A"/>
  <circle cx="108" cy="97" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- Wordmark -->
  <text x="228" y="72" fill="#475569"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="24" font-weight="650" letter-spacing="5.8">OPEN MEDIA</text>

  <text x="224" y="128" fill="#0F172A"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="54" font-weight="780" letter-spacing="-1.5">INTELLIGENCE</text>

  <rect x="228" y="149" width="54" height="5" rx="2.5" fill="#06B6D4"/>
  <text x="296" y="158" fill="#475569"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="560" letter-spacing="3.8">PLATFORM</text>
</svg>
